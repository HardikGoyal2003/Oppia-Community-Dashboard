name: Validate Firestore indexes

on:
  pull_request:
    paths:
      - "db/**"
      - "firestore.indexes.json"
      - "scripts/check-firestore-indexes.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-indexes.yml"
  push:
    branches:
      - main
    paths:
      - "db/**"
      - "firestore.indexes.json"
      - "scripts/check-firestore-indexes.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-indexes.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Firestore indexes
        run: npm run check:firestore-indexes
